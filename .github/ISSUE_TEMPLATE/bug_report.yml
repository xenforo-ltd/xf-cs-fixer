name: Bug report
description: Report a reproducible problem
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please search [existing issues](https://github.com/xenforo-ltd/xf-cs-fixer/issues) first.
        For help questions, see [support](https://github.com/xenforo-ltd/xf-cs-fixer/blob/main/.github/SUPPORT.md).
        Report vulnerabilities through a [private security report](https://github.com/xenforo-ltd/xf-cs-fixer/security/advisories/new).
        Do not include passwords, tokens, or private source code in your report or output.

  - id: summary
    type: textarea
    attributes:
      label: Summary
      description: Describe the expected and actual behavior.
      placeholder: An error occurred when I...
    validations:
      required: true

  - id: steps
    type: textarea
    attributes:
      label: Steps to reproduce
      description: Include the active configuration or affected rules, exact command, and relevant output or error.
    validations:
      required: true

  - id: example
    type: textarea
    attributes:
      label: Formatting example
      description: For formatting problems, include minimal PHP input and the actual and expected formatted output.

  - id: version
    type: textarea
    attributes:
      label: Versions
      description: Paste the output of `composer show xenforo-ltd/xf-cs-fixer`, `vendor/bin/php-cs-fixer --version`, and `php --version`.
    validations:
      required: true

  - id: screenshots
    type: upload
    attributes:
      label: Upload screenshots
      description: Add screenshots if they help explain the problem.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp"

  - id: terms
    type: checkboxes
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/xenforo-ltd/xf-cs-fixer/blob/main/.github/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow the [Code of Conduct](https://github.com/xenforo-ltd/xf-cs-fixer/blob/main/.github/CODE_OF_CONDUCT.md).
          required: true
